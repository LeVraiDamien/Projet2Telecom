# Passerelle N6 : TLS terminé ici, puis HTTP interne vers Django sur app-net.
upstream django {
    server 10.20.8.20:8000;      # scenario-b-django sur app-net
}

server_tokens off;               # ne pas annoncer la version de Nginx

# HTTP ne sert plus l'application : redirection permanente vers HTTPS
server {
    listen 80;
    server_name 10.20.6.20 telecom-lab.local localhost;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name 10.20.6.20 telecom-lab.local localhost;

    # Montés en lecture seule depuis secrets/tls/server (la clé de la CA n'est jamais montée)
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.2 : uniquement échange ECDHE (confidentialité persistante) + chiffrement AEAD
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
